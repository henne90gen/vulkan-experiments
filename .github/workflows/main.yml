name: Build and Test

on: [push]
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test
    steps:
      - uses: actions/checkout@v3
      - name: Install zig compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.328.1
          cache: true
      - run: zig build -Dvulkan-sdk-path="${VULKAN_SDK}"
      - run: zig build test -Dvulkan-sdk-path="${VULKAN_SDK}"

name: Build and Test

on: [push]
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test
    steps:
      - uses: actions/checkout@v3
      - name: Install zig compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.328.1
          cache: true

      - if: startsWith(matrix.os, 'linux')
        run: zig build -Dvulkan-sdk-path="$VULKAN_SDK"
      - if: startsWith(matrix.os, 'windows')
        run: |
          tree "$env:VULKAN_SDK"
          zig build -Dvulkan-sdk-path="$env:VULKAN_SDK"

      - if: startsWith(matrix.os, 'linux')
        run: zig build -Dvulkan-sdk-path="$VULKAN_SDK" test
      - if: startsWith(matrix.os, 'windows')
        run: zig build -Dvulkan-sdk-path="$env:VULKAN_SDK" test
